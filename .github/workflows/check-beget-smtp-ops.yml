name: Check Beget SMTP repair safety
on:
  push:
    branches:
      - ops/restore-beget-smtp-20261022
    paths:
      - 'ops/beget-restore-auth-smtp.py'
      - 'ops/test_smtp_restore.py'
      - '.github/workflows/check-beget-smtp-ops.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m py_compile ops/beget-restore-auth-smtp.py ops/test_smtp_restore.py
      - name: Run offline safety regression tests
        run: python -m unittest discover -v -s ops -p 'test_smtp_restore.py'
