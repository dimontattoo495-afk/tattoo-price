<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мои объявления — TATTOO PRICE</title><link rel="stylesheet" href="./styles.css"><style>.owner-grid{display:grid;gap:14px;max-width:900px}.owner-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.owner-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.owner-title{font-size:22px;font-weight:900;margin:4px 0 8px}.owner-meta{display:flex;gap:7px;flex-wrap:wrap}.owner-info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.owner-info>div{border:1px solid var(--line);border-radius:11px;padding:10px}.owner-info small{display:block;color:#85858e;margin-bottom:4px}.owner-actions{display:flex;gap:8px;flex-wrap:wrap}.owner-note{max-width:800px;line-height:1.6}.good{color:#85dfa6}@media(max-width:700px){.owner-head{display:block}.owner-info{grid-template-columns:1fr}}</style><meta name="robots" content="noindex,nofollow,noarchive">
</head><body><div class="wrap">
<header class="top"><a class="logo" href="./index.html">TATTOO <b>PRICE</b></a><nav class="nav"><a href="./index.html">Работы</a><a href="./publish.html" class="primary">Разместить бесплатно</a><button class="btn secondary" id="logoutBtn">Выйти</button></nav></header>
<section class="pagehead"><div class="eyebrow">КАБИНЕТ МАСТЕРА</div><h1>Мои объявления</h1><div class="muted owner-note" id="who">Загружаем аккаунт…</div></section><div id="status" class="notice">Загружаем объявления…</div><div id="list" class="owner-grid" style="margin-top:14px"></div>
<footer class="footer"><div>TATTOO PRICE © 2026</div><a href="./about.html">О сервисе</a><a href="./rules.html">Правила размещения</a><a href="./payment.html">Оплата и возврат</a><a href="./offer.html">Публичная оферта</a><a href="./privacy.html">Политика конфиденциальности</a><a href="./contacts.html">Контакты и реквизиты</a></footer></div>
<script src="./supabase-config.js"></script><script src="./tp-auth.js?v=1"></script><script src="./tp-api-payments.js?v=5"></script><script>
const list=document.querySelector('#list'),statusBox=document.querySelector('#status');const statusNames={pending_payment:'Ожидает оплаты',paid_review:'На модерации',published:'Опубликовано',hidden:'Скрыто',expired:'Срок закончился',rejected:'Отклонено',draft:'Черновик'};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const dateText=v=>v?new Date(v).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
function ownerItems(){const rows=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||!k.startsWith('tp_owner_'))continue;const n=k.slice(9),key=localStorage.getItem(k);if(n&&key)rows.push({publicNo:n,ownerKey:key});}return rows;}
function actionHtml(x){const no=Number(x.public_no),isPro=x.plan==='pro';let s='';if(x.status==='published')s+=`<a class="btn secondary" href="./listing.html?n=${no}">Открыть</a><button class="btn secondary" onclick="pay(${no},'boost')">Поднять · 50 ₽</button>`;if(x.status==='pending_payment')s+=`<button class="btn" onclick="pay(${no},'initial')">Оплатить PRO · 200 ₽</button>`;if(x.status==='paid_review')s+=`<span class="muted">Карточка ожидает модерации.</span>`;if((x.status==='published'||x.status==='paid_review')&&!isPro)s+=`<button class="btn" onclick="pay(${no},'upgrade')">Подключить PRO · 200 ₽</button>`;if(x.status==='published'&&isPro)s+=`<button class="btn" onclick="pay(${no},'renewal')">Продлить PRO на 30 дней · 200 ₽</button>`;if(x.status==='hidden')s+=`<span class="muted">Карточка скрыта администратором.</span>`;if(x.status==='rejected')s+=`<span class="muted">Карточка отклонена.</span>`;return s;}
function card(x){const isPro=x.plan==='pro',term=isPro&&x.expires_at?dateText(x.expires_at):'Без срока (FREE)';return `<article class="owner-card"><div class="owner-head"><div><div class="small">Объявление №${Number(x.public_no)}</div><div class="owner-title">${esc(x.title||'Без названия')}</div><div class="owner-meta"><span class="tag">${esc(x.city||'—')}</span><span class="tag">${esc(x.style||'—')}</span><span class="tag">${isPro?'PRO':'FREE'}</span><span class="tag">${esc(statusNames[x.status]||x.status)}</span></div></div><div style="font-weight:900">${isPro?'PRO · 200 ₽':'FREE · 0 ₽'}</div></div><div class="owner-info"><div><small>Статус</small><b>${esc(statusNames[x.status]||x.status)}</b></div><div><small>Тариф</small><b>${isPro?'PRO':'FREE'}</b></div><div><small>${isPro?'PRO действует до':'Размещение'}</small><b class="${isPro?'good':''}">${term}</b></div></div><div class="owner-actions">${actionHtml(x)}</div></article>`;}
window.pay=async function(no,mode){statusBox.textContent=mode==='boost'?'Создаём платёж на поднятие…':mode==='renewal'?'Создаём платёж на продление PRO…':'Создаём платёж PRO…';try{const ownerKey=localStorage.getItem(`tp_owner_${no}`)||'';const r=await TP.createTbankPayment(no,ownerKey,mode);if(!r.payment_url)throw new Error('Т-Банк не вернул ссылку на оплату');location.href=r.payment_url;}catch(e){statusBox.textContent='Ошибка: '+e.message;}};
async function load(){const user=await TPAuth.getUser();if(!user){location.href='./account.html?next=my.html';return;}document.querySelector('#who').textContent=`${user.email||'Аккаунт мастера'} · FREE бесплатно и бессрочно · PRO 200 ₽ / 30 дней · Поднять 50 ₽`;
  for(const it of ownerItems()){try{await TP.claimListing(it.publicNo,it.ownerKey);}catch(e){console.warn('claim',it.publicNo,e);}}
  try{const rows=await TP.getMyAccountListings();statusBox.textContent=rows?.length?`Найдено объявлений: ${rows.length}`:'В аккаунте пока нет объявлений.';list.innerHTML=(rows||[]).map(card).join('')||'<div class="panel"><a class="btn" href="./publish.html">РАЗМЕСТИТЬ ПЕРВУЮ РАБОТУ БЕСПЛАТНО</a></div>';}catch(e){statusBox.textContent='Не удалось загрузить объявления: '+e.message;}}
document.querySelector('#logoutBtn').onclick=async()=>{await TPAuth.signOut();location.href='./account.html';};load();
</script></body></html>
