<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Оплата — TATTOO PRICE</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="wrap">
<header class="top">
  <a class="logo" href="./index.html">TATTOO <b>PRICE</b></a>
  <nav class="nav">
    <a href="./my.html">Мои объявления</a>
    <a href="./index.html">На главную</a>
  </nav>
</header>

<section class="pagehead">
  <div class="eyebrow">Т-БАНК · ОПЛАТА РАЗМЕЩЕНИЯ</div>
  <h1 id="heading">Проверяем оплату</h1>
  <div class="muted" id="message">Получаем подтверждение платежа…</div>
</section>

<section class="panel" style="max-width:700px">
  <div id="paymentState" class="notice">Подождите несколько секунд.</div>

  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px">
    <a class="btn" href="./my.html">МОИ ОБЪЯВЛЕНИЯ</a>
    <a class="btn secondary" href="./index.html">НА ГЛАВНУЮ</a>
    <a class="btn secondary" href="./publish.html">РАЗМЕСТИТЬ ЕЩЁ</a>
  </div>
</section>

<footer class="footer">TATTOO PRICE</footer>
</div>

<script src="./supabase-config.js"></script>
<script src="./tp-api-payments.js?v=3"></script>
<script>
const q = new URLSearchParams(location.search);
const publicNo = q.get("n");
const returnedStatus = q.get("status");
const mode = q.get("mode") || "initial";
const orderId = q.get("order");

const state = document.querySelector("#paymentState");
const heading = document.querySelector("#heading");
const message = document.querySelector("#message");

function sleep(ms){
  return new Promise(resolve => setTimeout(resolve, ms));
}

function dateText(value){
  return value
    ? new Date(value).toLocaleString("ru-RU")
    : "";
}

async function check(){
  if(!publicNo){
    heading.textContent = "Не удалось определить объявление";
    message.textContent = "";
    state.textContent = "Вернитесь на сайт и попробуйте снова.";
    return;
  }

  const ownerKey = localStorage.getItem(`tp_owner_${publicNo}`);

  if(!ownerKey){
    heading.textContent =
      returnedStatus === "fail" ? "Оплата не завершена" : "Платёж обработан";
    message.textContent = "";
    state.textContent =
      "Откройте «Мои объявления» в том же браузере, в котором создавали публикацию.";
    return;
  }

  if(returnedStatus === "fail"){
    heading.textContent = "Оплата не прошла";
    message.textContent =
      mode === "renewal"
        ? "Срок публикации не изменён. Можно попробовать продлить ещё раз."
        : "Можно попробовать оплатить размещение снова.";
  }

  for(let i=0;i<12;i++){
    try{
      let p = null;

      if(orderId){
        p = await TP.getOwnerPaymentStatus(publicNo, ownerKey, orderId);
      }

      if(p?.payment_status === "succeeded"){
        if(p.payment_kind === "renewal"){
          heading.textContent = "Продление оплачено";
          message.textContent = "Публикация продлена ещё на 30 дней.";
          state.innerHTML =
            `Объявление № <b>${p.public_no}</b> действует до <b>${dateText(p.expires_at)}</b>.`;
        }else{
          heading.textContent = "Оплата прошла";
          message.textContent =
            "Объявление оплачено и отправлено на модерацию.";
          state.innerHTML =
            `Объявление № <b>${p.public_no}</b> · статус: <b>на модерации</b>.`;
        }
        return;
      }

      if(["failed","canceled","refunded"].includes(String(p?.payment_status))){
        heading.textContent = "Оплата не прошла";
        message.textContent =
          mode === "renewal"
            ? "Текущий срок публикации не изменён."
            : "Объявление пока не оплачено.";
        state.textContent = `Объявление №${publicNo}.`;
        return;
      }

      // Fallback for older return URLs without order id.
      if(!orderId){
        const x = await TP.getOwnerStatus(publicNo, ownerKey);
        if(mode === "initial" && x?.payment_status === "paid"){
          heading.textContent = "Оплата прошла";
          message.textContent = "Объявление оплачено.";
          state.textContent = `Объявление №${x.public_no}.`;
          return;
        }
      }

      state.textContent =
        `Ждём подтверждение от банка… попытка ${i+1}/12`;
    }catch(e){
      console.error(e);
    }

    await sleep(2000);
  }

  heading.textContent = "Платёж обрабатывается";
  message.textContent =
    "Подтверждение может прийти с небольшой задержкой.";
  state.textContent =
    "Не создавайте повторный платёж сразу. Проверьте статус в разделе «Мои объявления».";
}

check();
</script>
</body>
</html>
