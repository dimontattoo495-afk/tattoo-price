<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Разместить аренду — TATTOO PRICE</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="rent.css"></head><body>
<header class="top"><a class="brand" href="index.html">TATTOO <b>PRICE</b></a><nav class="nav"><a href="index.html">Мастера</a><a href="rent.html">Аренда</a><a class="primary" href="rent-publish.html">Разместить аренду</a><a id="rentAccountLink" href="account.html">Войти / кабинет</a></nav></header>
<main class="wrap"><section class="hero"><div class="eyebrow">АРЕНДА · FREE И PRO</div><h1>Разместить аренду</h1><p class="muted">FREE — бесплатно. PRO — 200 ₽ на 30 дней. После отправки объявление проходит модерацию.</p></section><div id="msg"></div>
<form class="form" id="rentPublishForm">
<select name="listing_mode"><option value="offer">Сдаю место</option><option value="wanted">Ищу место</option></select>
<select name="rent_type"><option value="workplace">Рабочее место</option><option value="guest_spot">Guest spot</option><option value="cabinet">Кабинет</option><option value="studio">Студия целиком</option></select>
<input name="city" required placeholder="Город"><input name="metro" placeholder="Метро">
<input class="span2" name="title" required placeholder="Заголовок"><input name="district" placeholder="Район"><input name="address_text" placeholder="Адрес/ориентир">
<input type="number" name="price_day" placeholder="₽ / день"><input type="number" name="price_week" placeholder="₽ / неделя"><input type="number" name="price_month" placeholder="₽ / месяц"><div></div>
<textarea class="span2" name="description" placeholder="Описание"></textarea><textarea class="span2" name="included" placeholder="Что входит"></textarea>
<textarea class="span2" name="conditions" placeholder="Условия"></textarea><textarea class="span2" name="photos" placeholder="Ссылки на фото, по одной на строку"></textarea>
<input name="contact_name" placeholder="Имя"><input name="contact_phone" placeholder="Телефон"><input name="contact_telegram" placeholder="Telegram"><input name="contact_vk" placeholder="VK">
<div class="span4 rent-tariffs">
<label class="rent-tariff"><input type="radio" name="plan_choice" value="free" checked><b>FREE · 0 ₽</b><span>Обычная публикация после модерации.</span></label>
<label class="rent-tariff"><input type="radio" name="plan_choice" value="pro"><b>PRO · 200 ₽ / 30 дней</b><span>Приоритет выше FREE и заметная PRO-карточка. Если объявление ещё на модерации, 30 дней начнутся с момента публикации.</span></label>
</div>
<button id="rentSubmitBtn" class="btn primary span4" type="submit">ОТПРАВИТЬ БЕСПЛАТНО НА МОДЕРАЦИЮ</button>
</form></main>
<script src="./supabase-config.js"></script><script src="./tp-auth.js?v=2"></script><script src="./rent-payments.js?v=1"></script><script src="./rent-publish.js?v=30"></script>
<script>(async function(){const a=document.getElementById('rentAccountLink');try{const u=window.TPAuth?await TPAuth.getUser():null;if(u){a.href='./my.html';a.textContent='Мои объявления';}}catch(e){}})();</script></body></html>
